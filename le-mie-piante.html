<style>
  :root{
    --accent:#3F7D5C;
    --accent-dark:#2E5C44;
    --sage:#8FBC94;
    --amber:#C98A3E;
    --danger:#C1594A;
    --text-1:#1F2A22;
    --text-2:#5B6B5E;
    --text-3:#8A9490;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-bg-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.65);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #plantApp{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    color:var(--text-1);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, #DCEEDD 0%, transparent 55%),
      radial-gradient(circle at 90% 10%, #F3ECD9 0%, transparent 45%),
      linear-gradient(180deg,#F6F8F3 0%,#EFF3EC 100%);
    padding-bottom:92px;
    position:relative;
  }
  .glass{
    background:var(--glass-bg);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:0.5px solid var(--glass-border);
    box-shadow:0 8px 32px rgba(31,42,34,0.08), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    padding:18px 20px 14px;
    background:rgba(246,248,243,0.7);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:0.5px solid rgba(255,255,255,0.5);
  }
  .topbar h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-0.4px;}
  .topbar p{font-size:13px;color:var(--text-2);margin:4px 0 0;}
  .content{padding:16px 16px 8px;max-width:520px;margin:0 auto;}
  .plant-card{
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:14px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .plant-card:active{transform:scale(0.98);}
  .ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:rgba(143,188,148,0.25);stroke-width:5;}
  .ring-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
  .ring-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .plant-info{flex:1;min-width:0;}
  .plant-info .name{font-size:16px;font-weight:600;margin:0 0 2px;}
  .plant-info .sub{font-size:12.5px;color:var(--text-2);margin:0;}
  .health-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px;}
  .badge{
    font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;
    background:rgba(63,125,92,0.12);color:var(--accent-dark);
    white-space:nowrap;
  }
  .badge.warn{background:rgba(201,138,62,0.15);color:#8A5A21;}
  .fab{
    position:fixed;right:20px;bottom:100px;z-index:30;
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    color:white;font-size:28px;border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(46,92,68,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    cursor:pointer;
  }
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:25;
    display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(246,248,243,0.75);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:0.5px solid rgba(255,255,255,0.6);
  }
  .tab-btn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--text-3);font-family:inherit;cursor:pointer;padding:4px 18px;
  }
  .tab-btn.active{color:var(--accent-dark);font-weight:600;}
  .tab-icon{font-size:20px;}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-2);
  }
  .empty-state .big{font-size:40px;margin-bottom:10px;}
  .sheet-overlay{
    position:fixed;inset:0;z-index:50;background:rgba(20,30,22,0.35);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:rgba(250,251,248,0.92);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    border-top:0.5px solid rgba(255,255,255,0.7);
  }
  .sheet-handle{width:40px;height:4px;background:rgba(31,42,34,0.15);border-radius:4px;margin:0 auto 16px;}
  .sheet h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-0.3px;}
  .sheet .close-x{
    position:absolute;top:18px;right:18px;background:rgba(31,42,34,0.06);
    border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--text-2);cursor:pointer;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500;}
  .field input[type=text], .field input[type=date], .field input[type=datetime-local], .field select, .field textarea{
    width:100%;padding:11px 13px;border-radius:12px;border:0.5px solid rgba(31,42,34,0.15);
    background:rgba(255,255,255,0.7);font-size:14.5px;font-family:inherit;color:var(--text-1);
    outline:none;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:80px;padding:9px 8px;border-radius:11px;border:0.5px solid rgba(31,42,34,0.15);
    background:rgba(255,255,255,0.5);font-size:13px;font-family:inherit;color:var(--text-2);cursor:pointer;
  }
  .seg button.sel{background:var(--accent);color:white;border-color:var(--accent);font-weight:500;}
  .btn-primary{
    width:100%;padding:13px;border-radius:14px;border:none;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    color:white;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px;
  }
  .btn-secondary{
    width:100%;padding:12px;border-radius:14px;border:0.5px solid rgba(31,42,34,0.15);
    background:rgba(255,255,255,0.5);color:var(--text-2);font-size:14px;font-family:inherit;cursor:pointer;margin-top:8px;
  }
  .action-row{display:flex;gap:8px;margin:14px 0;}
  .action-row button{
    flex:1;padding:12px 4px;border-radius:14px;border:0.5px solid rgba(31,42,34,0.1);
    background:rgba(255,255,255,0.55);font-family:inherit;font-size:12px;color:var(--text-1);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .action-row button .ic{font-size:19px;}
  .timeline{margin-top:10px;}
  .tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:0.5px solid rgba(31,42,34,0.08);}
  .tl-item:last-child{border-bottom:none;}
  .tl-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(63,125,92,0.12);flex-shrink:0;font-size:14px;}
  .tl-body{flex:1;}
  .tl-body .t{font-size:13.5px;font-weight:500;margin:0;}
  .tl-body .d{font-size:11.5px;color:var(--text-3);margin:2px 0 0;}
  .care-box{
    background:rgba(143,188,148,0.12);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13px;
  }
  .care-box .row{display:flex;justify-content:space-between;padding:5px 0;color:var(--text-2);}
  .care-box .row b{color:var(--text-1);font-weight:500;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{border-radius:16px;padding:14px;}
  .stat-card .label{font-size:12px;color:var(--text-2);margin:0 0 6px;}
  .stat-card .val{font-size:24px;font-weight:600;margin:0;letter-spacing:-0.5px;}
  .plant-photo{width:64px;height:64px;border-radius:16px;object-fit:cover;flex-shrink:0;}
  .detail-photo{width:100%;height:180px;object-fit:cover;border-radius:16px;margin-bottom:14px;}
  .germ-bar-wrap{background:rgba(31,42,34,0.08);border-radius:10px;height:8px;overflow:hidden;margin-top:8px;}
  .germ-bar-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--accent));border-radius:10px;}
</style>

<div id="plantApp">
  <div class="topbar">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h1>Le mie piante</h1>
        <p id="topbarSub">Caricamento...</p>
      </div>
      <button id="weatherChip" onclick="PlantApp.openSettings()" style="background:rgba(255,255,255,0.5);border:0.5px solid rgba(31,42,34,0.12);border-radius:20px;padding:6px 12px;font-size:12px;font-family:inherit;color:var(--text-2);cursor:pointer;white-space:nowrap;">Meteo...</button>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
  <button class="fab" id="fabAdd" aria-label="Aggiungi pianta">+</button>
  <div class="tabbar">
    <button class="tab-btn active" data-tab="piante"><span class="tab-icon">🌿</span>Piante</button>
    <button class="tab-btn" data-tab="stats"><span class="tab-icon">📊</span>Statistiche</button>
  </div>
</div>

<script>
(function(){
  const SPECIES = {
    basilico: {
      label:'Basilico', emoji:'🌱',
      wateringDays:1, fertilizingDays:21, pruningDays:45,
      wateringNote:'Ogni giorno, terriccio sempre umido (nebulizzazione se seme)',
      fertilizingNote:'Concime liquido bilanciato, a metà dose',
      pruningNote:'Cimatura apice a 6-8 foglie vere',
      germinationDays:10
    },
    salvia: {
      label:'Salvia', emoji:'🌿',
      wateringDays:6, fertilizingDays:60, pruningDays:180,
      wateringNote:'Rada, solo a terriccio asciutto',
      fertilizingNote:'Minima, non esigente',
      pruningNote:'A fine inverno, accorcia i rami di un terzo',
      germinationDays:null
    },
    rosmarino: {
      label:'Rosmarino', emoji:'🌲',
      wateringDays:8, fertilizingDays:75, pruningDays:365,
      wateringNote:'Rada, solo a terriccio asciutto',
      fertilizingNote:'Minima, non esigente',
      pruningNote:'Una volta l\'anno in primavera, mai nel legno vecchio',
      germinationDays:null
    },
    limone: {
      label:'Limone', emoji:'🍋',
      wateringDays:5, fertilizingDays:30, pruningDays:180,
      wateringNote:'Moderata, mai ristagno, mai secco a lungo',
      fertilizingNote:'Concime per agrumi in primavera-estate',
      pruningNote:'Rimuovi legno secco dopo conferma con scratch test',
      germinationDays:null
    },
    altro: {
      label:'Altra pianta', emoji:'🪴',
      wateringDays:5, fertilizingDays:30, pruningDays:120,
      wateringNote:'Da definire in base alla specie',
      fertilizingNote:'Da definire in base alla specie',
      pruningNote:'Da definire in base alla specie',
      germinationDays:null
    }
  };

  let plants = [];
  let activeTab = 'piante';
  let openPlantId = null;
  let weatherCache = null;
  const mainContent = document.getElementById('mainContent');
  const topbarSub = document.getElementById('topbarSub');

  function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
  function daysBetween(a,b){ return Math.floor((b - a) / 86400000); }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'});
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  }

  async function loadPlants(){
    try{
      const raw = localStorage.getItem('plantAppData');
      plants = raw ? JSON.parse(raw) : [];
    }catch(e){ plants = []; }
    plants.forEach(p => { (p.logs||[]).forEach(l => { if(!l.id) l.id = uid(); }); if(p.outdoor === undefined) p.outdoor = true; });
    render();
  }
  async function savePlants(){
    try{
      localStorage.setItem('plantAppData', JSON.stringify(plants));
    }catch(e){ console.error('Storage error', e); }
  }

  function getSettings(){
    try{
      const raw = localStorage.getItem('plantAppSettings');
      return raw ? JSON.parse(raw) : {city:'Mozzo (BG)', lat:null, lon:null};
    }catch(e){ return {city:'Mozzo (BG)', lat:null, lon:null}; }
  }
  function saveSettings(s){
    try{ localStorage.setItem('plantAppSettings', JSON.stringify(s)); }catch(e){}
  }

  async function geocodeCity(cityName){
    const query = cityName.split('(')[0].trim();
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=it&country=IT`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Geocoding fallito');
    const data = await res.json();
    if(!data.results || !data.results.length) throw new Error('Città non trovata');
    return {lat: data.results[0].latitude, lon: data.results[0].longitude};
  }

  async function fetchWeather(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum,temperature_2m_max,weathercode&past_days=2&forecast_days=2&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Meteo non disponibile');
    const data = await res.json();
    const d = data.daily;
    return {
      pastRain: d.precipitation_sum[0] || 0,
      todayRain: d.precipitation_sum[2] || 0,
      tomorrowRain: d.precipitation_sum[3] || 0,
      todayTemp: d.temperature_2m_max[2],
      todayCode: d.weathercode[2],
      fetchedAt: Date.now()
    };
  }

  function weatherIcon(code){
    if(code === 0) return '☀️';
    if(code <= 2) return '⛅';
    if(code === 3) return '☁️';
    if(code >= 51 && code <= 67) return '🌦️';
    if(code >= 71 && code <= 77) return '❄️';
    if(code >= 80 && code <= 82) return '🌧️';
    if(code >= 95) return '⛈️';
    return '🌡️';
  }

  async function refreshWeather(force){
    const settings = getSettings();
    try{
      const cachedRaw = localStorage.getItem('plantAppWeatherCache');
      const cached = cachedRaw ? JSON.parse(cachedRaw) : null;
      if(!force && cached && (Date.now() - cached.fetchedAt) < 3*3600*1000){
        weatherCache = {daily: cached};
        updateWeatherChip(settings.city, cached, null);
        return;
      }
      let lat = settings.lat, lon = settings.lon;
      if(!lat || !lon || force){
        const geo = await geocodeCity(settings.city);
        lat = geo.lat; lon = geo.lon;
        settings.lat = lat; settings.lon = lon;
        saveSettings(settings);
      }
      const daily = await fetchWeather(lat, lon);
      weatherCache = {daily};
      localStorage.setItem('plantAppWeatherCache', JSON.stringify(daily));
      updateWeatherChip(settings.city, daily, null);
    }catch(e){
      weatherCache = null;
      updateWeatherChip(settings.city, null, e.message);
    }
    render();
  }

  function updateWeatherChip(city, daily, errorMsg){
    const el = document.getElementById('weatherChip');
    if(!el) return;
    if(daily){
      el.innerHTML = `${weatherIcon(daily.todayCode)} ${Math.round(daily.todayTemp)}°C · ${city}`;
      el.style.color = '';
    } else {
      el.innerHTML = `⚠️ Meteo non disponibile · ${city}`;
      el.style.color = 'var(--text-3)';
    }
  }

  function openSettings(){
    const s = getSettings();
    const html = `<div class="sheet-overlay" id="settingsOverlay" onclick="if(event.target===this)PlantApp.closeSettings()">
      <div class="sheet" style="position:relative;">
        <button class="close-x" onclick="PlantApp.closeSettings()">✕</button>
        <div class="sheet-handle"></div>
        <h2>Impostazioni meteo</h2>
        <p style="font-size:12.5px;color:var(--text-2);margin:0 0 14px;">Il meteo locale rimanda in automatico i promemoria di irrigazione per le piante segnate come "all'aperto" quando ha piovuto o sta per piovere.</p>
        <div class="field">
          <label>Città</label>
          <input type="text" id="settingsCity" value="${escapeHtml(s.city)}" placeholder="Es. Mozzo (BG)"/>
        </div>
        <button class="btn-primary" onclick="PlantApp.saveSettingsSheet()">Salva e aggiorna meteo</button>
        <p id="settingsStatus" style="font-size:12px;color:var(--text-2);text-align:center;margin-top:10px;"></p>
      </div>
    </div>`;
    const wrap = document.createElement('div');
    wrap.id = 'settingsWrap';
    wrap.innerHTML = html;
    document.getElementById('plantApp').appendChild(wrap);
  }
  function closeSettings(){
    const el = document.getElementById('settingsWrap');
    if(el) el.remove();
  }
  async function saveSettingsSheet(){
    const cityInput = document.getElementById('settingsCity');
    const status = document.getElementById('settingsStatus');
    const city = cityInput.value.trim();
    if(!city){ cityInput.style.borderColor = 'var(--danger)'; return; }
    status.textContent = 'Aggiornamento in corso...';
    const s = getSettings();
    s.city = city; s.lat = null; s.lon = null;
    saveSettings(s);
    await refreshWeather(true);
    status.textContent = weatherCache ? 'Meteo aggiornato.' : 'Città non trovata o meteo non disponibile.';
  }

  function lastEventDate(plant, type){
    const evs = plant.logs.filter(l => l.type === type);
    if(evs.length === 0) return null;
    return evs.reduce((a,b) => new Date(a.date) > new Date(b.date) ? a : b).date;
  }

  function rainDelayDays(){
    if(!weatherCache || !weatherCache.daily) return 0;
    const d = weatherCache.daily;
    const recentRain = (d.pastRain || 0) >= 3;
    const todayRain = (d.todayRain || 0) >= 3;
    const tomorrowRain = (d.tomorrowRain || 0) >= 5;
    if(recentRain || todayRain) return 2;
    if(tomorrowRain) return 1;
    return 0;
  }

  function wateringProgress(plant){
    const sp = SPECIES[plant.species];
    const last = lastEventDate(plant,'water') || plant.startDate;
    const elapsed = daysBetween(new Date(last), new Date());
    const delay = plant.outdoor ? rainDelayDays() : 0;
    const effectiveDays = sp.wateringDays + delay;
    const pct = Math.max(0, Math.min(1, elapsed / effectiveDays));
    const daysLeft = effectiveDays - elapsed;
    return {pct, daysLeft, last, delayed: delay > 0};
  }

  function ringSvg(pct, urgent){
    const r = 27, c = 2*Math.PI*r;
    const offset = c * (1-pct);
    const color = urgent ? 'var(--amber)' : 'var(--accent)';
    return `<div class="ring-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="ring-bg" cx="32" cy="32" r="${r}"/>
        <circle class="ring-fg" cx="32" cy="32" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="ring-icon">💧</div>
    </div>`;
  }

  function healthColor(status){
    if(status === 'ottima') return '#4A9463';
    if(status === 'attenzione') return '#C98A3E';
    return '#C1594A';
  }
  function healthLabel(status){
    if(status === 'ottima') return 'Ottima';
    if(status === 'attenzione') return 'Attenzione';
    return 'In difficoltà';
  }

  function render(){
    topbarSub.textContent = plants.length ? `${plants.length} ${plants.length===1?'pianta monitorata':'piante monitorate'}` : 'Aggiungi la tua prima pianta';
    if(activeTab === 'piante') renderPiante();
    else renderStats();
  }

  function renderPiante(){
    if(plants.length === 0){
      mainContent.innerHTML = `<div class="empty-state"><div class="big">🌱</div><p>Nessuna pianta ancora.<br>Tocca + per aggiungerne una.</p></div>`;
      return;
    }
    let html = '';
    plants.forEach(plant => {
      const sp = SPECIES[plant.species];
      const wp = wateringProgress(plant);
      const urgent = wp.daysLeft <= 0;
      const badgeText = urgent ? 'Innaffia ora' : `Tra ${wp.daysLeft}g`;
      const rainNote = wp.delayed ? `<p class="sub" style="color:var(--accent-dark);">🌧️ Rimandata per pioggia</p>` : '';
      html += `<div class="plant-card glass" onclick="PlantApp.openDetail('${plant.id}')">
        ${plant.photo ? `<img class="plant-photo" src="${plant.photo}"/>` : ringSvg(wp.pct, urgent)}
        <div class="plant-info">
          <p class="name">${plant.name}</p>
          <p class="sub"><span class="health-dot" style="background:${healthColor(plant.health)}"></span>${sp.emoji} ${sp.label} · ${healthLabel(plant.health)}</p>
          ${rainNote}
        </div>
        <span class="badge ${urgent?'warn':''}">${badgeText}</span>
      </div>`;
    });
    mainContent.innerHTML = html;
  }

  function renderStats(){
    const total = plants.length;
    const needWater = plants.filter(p => wateringProgress(p).daysLeft <= 0).length;
    const seeds = plants.filter(p => p.stage === 'seme' && SPECIES[p.species].germinationDays);
    let html = `<div class="stat-grid">
      <div class="stat-card glass"><p class="label">Piante totali</p><p class="val">${total}</p></div>
      <div class="stat-card glass"><p class="label">Da innaffiare</p><p class="val" style="color:${needWater>0?'var(--amber)':'var(--accent)'}">${needWater}</p></div>
    </div>`;

    if(seeds.length){
      html += `<div class="care-box glass" style="margin-bottom:16px;"><p class="t" style="font-weight:600;margin:0 0 8px;">Countdown germinazione</p>`;
      seeds.forEach(p => {
        const sp = SPECIES[p.species];
        const elapsed = daysBetween(new Date(p.startDate), new Date());
        const pct = Math.max(0, Math.min(1, elapsed / sp.germinationDays));
        const remain = Math.max(0, sp.germinationDays - elapsed);
        html += `<div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${p.name}</span><span style="color:var(--text-2)">${remain>0 ? remain+' giorni circa' : 'a giorni!'}</span></div>
          <div class="germ-bar-wrap"><div class="germ-bar-fill" style="width:${pct*100}%"></div></div>
        </div>`;
      });
      html += `</div>`;
    }

    if(total > 0){
      html += `<div class="care-box glass"><p class="t" style="font-weight:600;margin:0 0 8px;">Ultima cura per pianta</p>`;
      plants.forEach(p => {
        const lw = lastEventDate(p,'water');
        const lf = lastEventDate(p,'fertilize');
        html += `<div class="row"><span>${p.name}</span><b>${lw ? fmtDate(lw)+' 💧' : 'mai innaffiata'}${lf ? ' · '+fmtDate(lf)+' 🌾' : ''}</b></div>`;
      });
      html += `</div>`;
    } else {
      mainContent.innerHTML = `<div class="empty-state"><div class="big">📊</div><p>Le statistiche appariranno<br>appena aggiungi una pianta.</p></div>`;
      return;
    }
    mainContent.innerHTML = html;
  }

  function openDetail(id){
    const plant = plants.find(p => p.id === id);
    if(!plant) return;
    openPlantId = id;
    const sp = SPECIES[plant.species];
    const wp = wateringProgress(plant);
    const lf = lastEventDate(plant,'fertilize');
    const lp = lastEventDate(plant,'prune');

    const sortedLogs = [...plant.logs].sort((a,b)=> new Date(b.date)-new Date(a.date));
    let timelineHtml = sortedLogs.length ? '' : '<p style="font-size:13px;color:var(--text-3);text-align:center;padding:10px 0;">Nessuna attività registrata.</p>';
    const icons = {water:'💧',fertilize:'🌾',prune:'✂️',note:'📝'};
    sortedLogs.slice(0,25).forEach(l => {
      const labels = {water:'Innaffiata',fertilize:'Concimata',prune:'Potata',note:'Nota'};
      timelineHtml += `<div class="tl-item" style="cursor:pointer;" onclick="PlantApp.openLogSheet('${id}','${l.type}','${l.id}')">
        <div class="tl-icon">${icons[l.type]}</div>
        <div class="tl-body"><p class="t">${labels[l.type]}${l.note ? ' — '+escapeHtml(l.note) : ''}</p><p class="d">${fmtDateTime(l.date)}</p></div>
      </div>`;
    });

    const healthOptions = ['ottima','attenzione','difficolta'].map(h =>
      `<button class="${plant.health===h?'sel':''}" onclick="PlantApp.setHealth('${id}','${h}')">${healthLabel(h)}</button>`).join('');

    const sheetHtml = `<div class="sheet-overlay" id="detailOverlay" onclick="if(event.target===this)PlantApp.closeDetail()">
      <div class="sheet" style="position:relative;">
        <button class="close-x" onclick="PlantApp.closeDetail()">✕</button>
        <div class="sheet-handle"></div>
        ${plant.photo ? `<img class="detail-photo" src="${plant.photo}"/>` : ''}
        <h2>${sp.emoji} ${plant.name}</h2>
        <p style="font-size:13px;color:var(--text-2);margin:0 0 4px;">${sp.label} · ${plant.stage==='seme'?'da seme':'travasata'} il ${fmtDate(plant.startDate)}</p>

        <div class="field" style="margin-top:12px;">
          <label>Stato di salute</label>
          <div class="seg">${healthOptions}</div>
        </div>

        <div class="action-row">
          <button onclick="PlantApp.openLogSheet('${id}','water')"><span class="ic">💧</span>Innaffia</button>
          <button onclick="PlantApp.openLogSheet('${id}','fertilize')"><span class="ic">🌾</span>Concima</button>
          <button onclick="PlantApp.openLogSheet('${id}','prune')"><span class="ic">✂️</span>Pota</button>
        </div>
        <p style="font-size:11.5px;color:var(--text-3);text-align:center;margin:-8px 0 0;">Tocca un'azione per registrarla a data odierna o passata</p>

        <div class="care-box">
          <p style="font-weight:600;margin:0 0 6px;font-size:13.5px;">Scheda di cura — ${sp.label}</p>
          <div class="row"><span>Irrigazione</span><b>${wp.daysLeft<=0?'ora':`tra ${wp.daysLeft}g`}</b></div>
          <p style="font-size:12px;color:var(--text-2);margin:0 0 6px;">${sp.wateringNote}</p>
          <div class="row"><span>Concimazione</span><b>${lf ? Math.max(0, sp.fertilizingDays - daysBetween(new Date(lf),new Date())) + 'g' : 'da avviare'}</b></div>
          <p style="font-size:12px;color:var(--text-2);margin:0 0 6px;">${sp.fertilizingNote}</p>
          <div class="row"><span>Potatura</span><b>${lp ? Math.max(0, sp.pruningDays - daysBetween(new Date(lp),new Date())) + 'g' : 'da avviare'}</b></div>
          <p style="font-size:12px;color:var(--text-2);margin:0;">${sp.pruningNote}</p>
        </div>

        <div class="field" style="margin-top:14px;">
          <label>Aggiungi una nota</label>
          <textarea id="noteInput" placeholder="Es. spuntati i primi germogli"></textarea>
          <button class="btn-secondary" onclick="PlantApp.addNote('${id}')">Salva nota</button>
        </div>

        <p style="font-weight:600;font-size:14px;margin:18px 0 4px;">Cronologia</p>
        <div class="timeline">${timelineHtml}</div>

        <button class="btn-secondary" style="color:var(--danger);margin-top:18px;" onclick="PlantApp.deletePlant('${id}')">Elimina pianta</button>
      </div>
    </div>`;
    const wrap = document.createElement('div');
    wrap.id = 'detailWrap';
    wrap.innerHTML = sheetHtml;
    document.getElementById('plantApp').appendChild(wrap);
  }

  function closeDetail(){
    const el = document.getElementById('detailWrap');
    if(el) el.remove();
    openPlantId = null;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function toLocalInputValue(d){
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off*60000);
    return local.toISOString().slice(0,16);
  }

  function openLogSheet(plantId, type, logId){
    const plant = plants.find(p => p.id === plantId);
    if(!plant) return;
    const existing = logId ? plant.logs.find(l => l.id === logId) : null;
    const labels = {water:'Innaffiatura',fertilize:'Concimazione',prune:'Potatura',note:'Nota'};
    const dateVal = toLocalInputValue(existing ? new Date(existing.date) : new Date());
    const noteVal = existing && existing.note ? existing.note : '';
    const html = `<div class="sheet-overlay" id="logOverlay" onclick="if(event.target===this)PlantApp.closeLogSheet()">
      <div class="sheet" style="position:relative;">
        <button class="close-x" onclick="PlantApp.closeLogSheet()">✕</button>
        <div class="sheet-handle"></div>
        <h2>${existing ? 'Modifica' : 'Registra'} · ${labels[type] || 'Attività'}</h2>
        <div class="field">
          <label>Data e ora</label>
          <input type="datetime-local" id="logDateInput" value="${dateVal}" max="${toLocalInputValue(new Date())}"/>
        </div>
        <div class="field">
          <label>Nota (opzionale)</label>
          <textarea id="logNoteInput" placeholder="Es. innaffiata abbondantemente">${escapeHtml(noteVal)}</textarea>
        </div>
        <button class="btn-primary" onclick="PlantApp.saveLogSheet('${plantId}','${type}','${logId||''}')">Salva</button>
        ${existing ? `<button class="btn-secondary" style="color:var(--danger);" onclick="PlantApp.deleteLog('${plantId}','${logId}')">Elimina registrazione</button>` : ''}
      </div>
    </div>`;
    const wrap = document.createElement('div');
    wrap.id = 'logWrap';
    wrap.innerHTML = html;
    document.getElementById('plantApp').appendChild(wrap);
  }

  function closeLogSheet(){
    const el = document.getElementById('logWrap');
    if(el) el.remove();
  }

  async function saveLogSheet(plantId, type, logId){
    const plant = plants.find(p => p.id === plantId);
    if(!plant) return;
    const dateInput = document.getElementById('logDateInput');
    const noteInput = document.getElementById('logNoteInput');
    if(!dateInput.value){
      dateInput.style.borderColor = 'var(--danger)';
      return;
    }
    const isoDate = new Date(dateInput.value).toISOString();
    const note = noteInput.value.trim();
    if(logId){
      const log = plant.logs.find(l => l.id === logId);
      if(log){
        log.date = isoDate;
        if(note) log.note = note; else delete log.note;
      }
    } else {
      const newLog = {id: uid(), type, date: isoDate};
      if(note) newLog.note = note;
      plant.logs.push(newLog);
    }
    await savePlants();
    closeLogSheet();
    closeDetail();
    render();
    openDetail(plantId);
  }

  async function deleteLog(plantId, logId){
    const plant = plants.find(p => p.id === plantId);
    if(!plant) return;
    plant.logs = plant.logs.filter(l => l.id !== logId);
    await savePlants();
    closeLogSheet();
    closeDetail();
    render();
    openDetail(plantId);
  }

  async function addNote(id){
    const plant = plants.find(p => p.id === id);
    const input = document.getElementById('noteInput');
    const val = input.value.trim();
    if(!val) return;
    plant.logs.push({id: uid(), type:'note', date:new Date().toISOString(), note:val});
    await savePlants();
    closeDetail();
    openDetail(id);
  }

  async function setHealth(id, status){
    const plant = plants.find(p => p.id === id);
    plant.health = status;
    await savePlants();
    closeDetail();
    render();
    openDetail(id);
  }

  async function deletePlant(id){
    plants = plants.filter(p => p.id !== id);
    await savePlants();
    closeDetail();
    render();
  }

  function openAddSheet(){
    const speciesOptions = Object.keys(SPECIES).map(k =>
      `<button data-sp="${k}" class="${k==='basilico'?'sel':''}" onclick="PlantApp.selectSpecies(this,'${k}')">${SPECIES[k].emoji} ${SPECIES[k].label}</button>`
    ).join('');
    const html = `<div class="sheet-overlay" id="addOverlay" onclick="if(event.target===this)PlantApp.closeAdd()">
      <div class="sheet" style="position:relative;">
        <button class="close-x" onclick="PlantApp.closeAdd()">✕</button>
        <div class="sheet-handle"></div>
        <h2>Nuova pianta</h2>
        <div class="field">
          <label>Nome</label>
          <input type="text" id="newName" placeholder="Es. Basilico balcone"/>
        </div>
        <div class="field">
          <label>Specie</label>
          <div class="seg" id="speciesSeg">${speciesOptions}</div>
        </div>
        <div class="field">
          <label>Stadio</label>
          <div class="seg">
            <button class="sel" id="stageSeme" onclick="PlantApp.selectStage('seme')">Da seme</button>
            <button id="stagePianta" onclick="PlantApp.selectStage('pianta')">Pianta travasata</button>
          </div>
        </div>
        <div class="field">
          <label>Data di inizio</label>
          <input type="date" id="newDate" value="${new Date().toISOString().slice(0,10)}"/>
        </div>
        <div class="field">
          <label>Foto (opzionale)</label>
          <input type="file" accept="image/*" id="newPhoto"/>
        </div>
        <div class="field">
          <label>Posizione</label>
          <div class="seg">
            <button class="sel" id="outdoorYes" onclick="PlantApp.selectOutdoor(true)">All'aperto</button>
            <button id="outdoorNo" onclick="PlantApp.selectOutdoor(false)">Al chiuso</button>
          </div>
        </div>
        <button class="btn-primary" onclick="PlantApp.createPlant()">Aggiungi pianta</button>
      </div>
    </div>`;
    const wrap = document.createElement('div');
    wrap.id = 'addWrap';
    wrap.innerHTML = html;
    document.getElementById('plantApp').appendChild(wrap);
    window._selectedSpecies = 'basilico';
    window._selectedStage = 'seme';
    window._selectedOutdoor = true;
  }
  function closeAdd(){
    const el = document.getElementById('addWrap');
    if(el) el.remove();
  }
  function selectSpecies(btn, key){
    document.querySelectorAll('#speciesSeg button').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    window._selectedSpecies = key;
  }
  function selectStage(stage){
    document.getElementById('stageSeme').classList.toggle('sel', stage==='seme');
    document.getElementById('stagePianta').classList.toggle('sel', stage==='pianta');
    window._selectedStage = stage;
  }
  function selectOutdoor(val){
    document.getElementById('outdoorYes').classList.toggle('sel', val===true);
    document.getElementById('outdoorNo').classList.toggle('sel', val===false);
    window._selectedOutdoor = val;
  }

  function resizeImage(file, maxW){
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function createPlant(){
    const nameInput = document.getElementById('newName');
    const name = nameInput.value.trim();
    if(!name){
      nameInput.style.borderColor = 'var(--danger)';
      return;
    }
    const dateVal = document.getElementById('newDate').value;
    const photoFile = document.getElementById('newPhoto').files[0];
    let photo = null;
    if(photoFile){
      try{ photo = await resizeImage(photoFile, 400); }catch(e){ photo = null; }
    }
    const plant = {
      id: uid(),
      name,
      species: window._selectedSpecies || 'basilico',
      stage: window._selectedStage || 'seme',
      outdoor: window._selectedOutdoor !== false,
      startDate: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
      health: 'ottima',
      photo,
      logs: []
    };
    plants.push(plant);
    await savePlants();
    closeAdd();
    render();
  }

  function switchTab(tab){
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    render();
  }

  document.getElementById('fabAdd').addEventListener('click', openAddSheet);
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  window.PlantApp = {
    openDetail, closeDetail, addNote, setHealth, deletePlant,
    openAddSheet, closeAdd, selectSpecies, selectStage, selectOutdoor, createPlant,
    openLogSheet, closeLogSheet, saveLogSheet, deleteLog,
    openSettings, closeSettings, saveSettingsSheet
  };

  loadPlants();
  refreshWeather(false);
})();
</script>
